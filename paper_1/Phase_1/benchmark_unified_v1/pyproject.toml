[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-unified-benchmark"
version = "0.1.0"
description = "Controlled England Wyscout benchmark for HGT and event-sequence baselines"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "torch>=2.4",
  "torch-geometric>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
possession-graph = ["pyarrow>=24,<26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
